<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metodo MAP em JS</title>
</head>
<body>
    <script>
        // O metodo Map é usado para interagir com cada elemento em um array e cria um novo array

        let numeros = [1,2,3,4,5]

        
       

        function triplo(element){
            return element * 3
        }
        let numeros_triplo = numeros.map(triplo);
         console.log(numeros_triplo)
    </script>
</body>
</html>
