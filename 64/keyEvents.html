<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key events em JS</title>
    <style>
      #caixa {
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        background-color: lightblue;
        border-radius: 10px;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="caixa">😐</div>
    <script>
      const caixa = document.getElementById("caixa");
      let y = 0;
      let x = 0;
      const movimento = 10;

      document.addEventListener("keydown", function mover(event) {
        if (event.key.startsWith("Arrow")) {
          switch (event.key) {
            case "ArrowUp":
              y -= movimento;
              break;
            case "ArrowDown":
              y += movimento;
              break;
            case "ArrowLeft":
              x -= movimento;
              break;
            case "ArrowRight":
              x += movimento;
              break;
          }

          caixa.style.top = `${y}px`;
          caixa.style.left = `${x}px`;
        }
        caixa.style.backgroundColor = "green";
        caixa.textContent = "😁";
      });

      document.addEventListener("keyup", function stop() {
        caixa.style.backgroundColor = "lightblue";
        caixa.textContent = "😐";
      });
    </script>
  </body>
</html>
