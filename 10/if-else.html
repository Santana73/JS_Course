<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação em JS</title>
        <style>

            body{
                background-color: hsl(239, 100%, 70%);
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
                padding: 0%;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }

            h1{
                color: black;
                padding: 0%;
                margin: 0%;
                margin-bottom: 15px;
            }

            #form{
               background-color: white;
               padding: 20px 30px;
               border-radius: 10px;
               box-shadow: 0px 5px 10px grey;
            }

            input{
                display: block;
                width: 90%;
                padding: 10px;
                border: 1px solid rgba(0,0,0,0.7);
                border-radius: 7px;
            }

            button{
            display: flex;
            margin: auto;
            color: black;
            background-color: white;
            border: 0;
            padding: 5px 15px;
            font-size: 1rem;
            border-radius: 7px;
            margin-top: 10px;
            border: 1px solid  ;
            transition: all 0.2s;
            }

            ::placeholder {
                color: #999999;
                font-style: italic;
                font-size: 14px;
            }
            #login{
                margin-bottom: 10px;
            }

            span{
            margin-top:10px ;
            display: flex;
            align-items: center;
            justify-content: center;
            }

        </style>
</head>
<body>
    <div id="form">

        <h1>Faça seu Login</h1>

        
        <label for="login">Email</label>
        <input type="email" id="login" placeholder="email@gmail.com">

        <label for="Senha">Senha</label>
        <input type="password" id="Senha" placeholder="123456789">

        <button id="botao">Prosseguir</button>
        
        <span id="span"></span>
    </div>
    <script>


        let resposta = document.getElementById("span");
        let botao = document.getElementById('botao');
        
        botao.onclick = function(){
                let email = document.getElementById('login').value;
                let senha = document.getElementById('Senha').value;

            if(email == 'danielsantana13252@gmail.com' && senha == '123456789' ){
                resposta.innerText = "Seu login foi feito"
                resposta.style.color = 'green'
            }else{
                resposta.innerText = "Seu login não foi feito"
                resposta.style.color = 'red'
            }
        }
       
    </script>
</body>
</html>
